name: Fresh Install CI

# 陌生环境首次安装自动验证：clean runner → Python 3.13 → 安装 Hermes
# （固定 GitHub v2026.8.19 发布来源——Hermes 0.20 系，PyPI 仅到 0.19.0 且
# 其 config set 存字符串不兼容）→ 安装 HUD → 安全 enable → 启动 → HTTP smoke
# → 回归守卫 → 精确清理。不依赖开发机状态；不使用裸 pip install hermes-agent。

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'scripts/**'
      - 'requirements*'
      - 'pyproject*'
      - 'INSTALL.md'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/fresh-install.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/**'
      - 'requirements*'
      - 'pyproject*'
      - 'INSTALL.md'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/fresh-install.yml'
  workflow_dispatch:

jobs:
  fresh-install:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      HERMES_HOME: /tmp/hermes-fresh-home
      HUD_SRC: /tmp/hermes-fresh-home/plugins/hermes-hud
    steps:
      - name: Checkout hermes-hud
        uses: actions/checkout@v4

      - name: Setup Python 3.13 (fixed, <3.14)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python version
        run: |
          python --version
          pip --version
          python -c 'import sys; assert sys.version_info < (3, 14), "Python must be <3.14"'
          echo "PASS: Python 3.13 ready"

      - name: Install Hermes (pinned PyPI 0.19.0 — empirically verified)
        run: |
          pip install --quiet "hermes-agent==0.19.0"
          python - <<'PY'
          import importlib.metadata
          ver = importlib.metadata.version("hermes-agent")
          print("installed hermes-agent:", ver)
          assert ver == "0.19.0", f"expected 0.19.0, got {ver}"
          PY
          hermes --version
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'

      - name: Diagnostic — Hermes config API capability (truth, not guess)
        run: |
          python - <<'PY'
          import hermes_cli.config as c
          for name in ("load_config", "save_config", "cfg_get", "get_config_value"):
              print(name, hasattr(c, name))
          PY
          hermes config --help 2>&1 | head -12
          hermes config --help 2>&1 | tee /tmp/hermes-config-help.txt

      - name: Install hermes-hud plugin (public path from INSTALL.md)
        run: |
          mkdir -p "$HERMES_HOME/plugins"
          git clone --depth 1 https://github.com/Diabloluo/hermes-hud "$HUD_SRC"
          ls "$HUD_SRC/dashboard/manifest.json"

      - name: Capture plugins.enabled baseline
        run: |
          python - <<'PY'
          import hermes_cli.config as c
          cfg = c.load_config()
          print("baseline:", (cfg.get("plugins") or {}).get("enabled") or [])
          PY

      - name: Enable dashboard plugin (safe read-merge-write, diagnosable)
        run: |
          set -o pipefail
          python scripts/enable_dashboard_plugin.py enable 2>&1 | tee /tmp/enable.log
          echo "--- enabled after: ---"
          python -c "import hermes_cli.config as c; cfg=c.load_config(); print((cfg.get('plugins') or {}).get('enabled'))"

      - name: Config safety — preserved + added once + idempotent
        run: |
          read_enabled() { python -c "import hermes_cli.config as c; cfg=c.load_config(); print(__import__('json').dumps((cfg.get('plugins') or {}).get('enabled') or []))"; }
          BEFORE=$(read_enabled)
          python scripts/enable_dashboard_plugin.py enable
          AFTER=$(read_enabled)
          python - "$BEFORE" "$AFTER" <<'PY'
          import json, sys
          before = json.loads(sys.argv[1] or "[]")
          after = json.loads(sys.argv[2] or "[]")
          assert before.count("hermes-hud") == 1, f"enable 后 hermes-hud 不在: {before}"
          assert after.count("hermes-hud") == 1, f"幂等失败（重复）: {after}"
          assert after == before, f"二次 enable 改变了列表: {after}"
          print("PASS: enabled once, idempotent, no duplicates")
          PY

      - name: Disable only removes hermes-hud (then re-enable)
        run: |
          python scripts/enable_dashboard_plugin.py disable
          python - <<'PY'
          import hermes_cli.config as c
          cfg = c.load_config()
          after = (cfg.get("plugins") or {}).get("enabled") or []
          assert "hermes-hud" not in after, f"disable 未移除: {after}"
          print(f"PASS: disable removed only hermes-hud (remaining: {after})")
          PY
          python scripts/enable_dashboard_plugin.py enable

      - name: Start dashboard and wait for readiness (polling, no bare sleep)
        run: |
          hermes dashboard --host 127.0.0.1 --port 9121 \
            --no-open > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid
          echo "dashboard PID: $(cat /tmp/dashboard.pid)"
          python scripts/fresh_install_check.py wait-http http://127.0.0.1:9121/ 60 1

      - name: HTTP smoke — GET / and snapshot endpoint
        run: |
          curl -sf -o /tmp/root.html http://127.0.0.1:9121/ && echo "GET / -> 200 OK"
          TOKEN=$(grep -o 'window.__HERMES_SESSION_TOKEN__="[^"]*"' /tmp/root.html \
            | sed 's/.*="//;s/"//')
          curl -sf -H "X-Hermes-Session-Token: $TOKEN" \
            -o /tmp/snapshot.json http://127.0.0.1:9121/api/plugins/hermes-hud/snapshot
          python scripts/fresh_install_check.py check-json /tmp/snapshot.json \
            generated_at_iso tz db gateway system
          echo "--- snapshot size: $(wc -c < /tmp/snapshot.json) bytes"

      - name: Regression guards — no CST is not defined
        run: |
          cat /tmp/dashboard.log /tmp/snapshot.json > /tmp/cst-check.txt
          python scripts/fresh_install_check.py check-no-cst /tmp/cst-check.txt

      - name: Clean shutdown (owned PID only)
        if: always()
        run: |
          PID=$(cat /tmp/dashboard.pid 2>/dev/null || echo 0)
          python scripts/fresh_install_check.py cleanup-owned "$PID"
          sleep 2
          ps -p "$PID" > /dev/null 2>&1 && { echo "FAIL: orphan dashboard $PID"; exit 1; } \
            || echo "PASS: no orphan dashboard process"

      - name: Upload failure artifacts (redacted, diagnosable)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-failure
          path: |
            /tmp/enable.log
            /tmp/dashboard.log
            /tmp/root.html
            /tmp/snapshot.json
            /tmp/hermes-config-help.txt
            /tmp/versions.txt
            /tmp/config-redacted.yaml
          if-no-files-found: ignore

      - name: Diagnosable context — versions + API summary (never upload secrets)
        if: failure()
        run: |
          python --version 2>&1 | tee /tmp/versions.txt
          hermes --version 2>&1 | tee -a /tmp/versions.txt
          python -c "import hermes_cli.config as c; print([(n, hasattr(c, n)) for n in ('load_config','save_config','cfg_get','get_config_value')])" 2>&1 | tee -a /tmp/versions.txt
          python scripts/fresh_install_check.py redact-config \
            "$HERMES_HOME/config.yaml" /tmp/config-redacted.yaml
