name: Isolated finite memory experiment on test branch only
run-name: finite-memory-${{ inputs.authorization_id }}

# This existing workflow filename is registered on main. Only its test-branch
# definition is replaced, so dispatch --ref works without touching main.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact full SHA accepted by the focused safety review
        required: true
        type: string
      reviewed_freeze:
        description: SHA256 of the reviewed FREEZE.json bytes
        required: true
        type: string
      authorization_id:
        description: Single owner authorization consumed locally before dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hud-finite-memory-owned
  cancel-in-progress: false

jobs:
  finite:
    if: github.repository == 'Diabloluo/hermes-hud' && github.ref == 'refs/heads/test/v2-isolated-memory-20261003' && github.run_attempt == 1 && github.sha == inputs.reviewed_sha
    runs-on: macos-latest
    timeout-minutes: 135
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      REVIEWED_FREEZE: ${{ inputs.reviewed_freeze }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Single setup no retry
        timeout-minutes: 30
        run: >-
          python -I -B scripts/isolated_memory/runner.py setup
          --sha "$REVIEWED_SHA" --freeze "$REVIEWED_FREEZE" --grant "$AUTHORIZATION_ID"
      - name: One finite pair no retry
        timeout-minutes: 100
        run: >-
          "$RUNNER_TEMP/hud-finite-owned/venv/bin/python" -I -B
          scripts/isolated_memory/runner.py pair
          --sha "$REVIEWED_SHA" --freeze "$REVIEWED_FREEZE" --grant "$AUTHORIZATION_ID"
      - name: Independent aggregate analysis including failure
        if: always()
        timeout-minutes: 3
        run: >-
          python -I -B scripts/isolated_memory/analyze.py
          "$RUNNER_TEMP/hud-finite-owned"
      - name: Aggregate report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-memory-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/hud-finite-owned/aggregate-artifact/analysis.json
          if-no-files-found: error
          retention-days: 14
