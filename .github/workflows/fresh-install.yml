name: Isolated single same trace finite pair
run-name: same-trace-pair-${{ inputs.authorization_id }}
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        required: true
        type: string
      reviewed_freeze:
        required: true
        type: string
      reviewed_report:
        required: true
        type: string
      authorization_id:
        required: true
        type: string
      issued:
        required: true
        type: string
      expires:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hud-finite-memory-owned
  cancel-in-progress: false
jobs:
  pair:
    if: github.repository == 'Diabloluo/hermes-hud' && github.ref == 'refs/heads/test/v2-isolated-memory-20261003' && github.run_attempt == 1 && github.sha == inputs.reviewed_sha
    runs-on: macos-15-intel
    timeout-minutes: 135
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      REVIEWED_FREEZE: ${{ inputs.reviewed_freeze }}
      REVIEWED_REPORT: ${{ inputs.reviewed_report }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      ISSUED: ${{ inputs.issued }}
      EXPIRES: ${{ inputs.expires }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Single install no retry
        timeout-minutes: 30
        run: >-
          python -I -B scripts/isolated_memory/entry.py setup
          --sha "$REVIEWED_SHA" --freeze "$REVIEWED_FREEZE" --grant "$AUTHORIZATION_ID"
          --review "$REVIEWED_REPORT" --issued "$ISSUED" --expires "$EXPIRES"
      - name: Single finite pair no retry
        timeout-minutes: 100
        run: >-
          "$RUNNER_TEMP/hud-finite-attribution-owned/venv/bin/python" -I -B
          scripts/isolated_memory/entry.py run
          --sha "$REVIEWED_SHA" --freeze "$REVIEWED_FREEZE" --grant "$AUTHORIZATION_ID"
          --review "$REVIEWED_REPORT" --issued "$ISSUED" --expires "$EXPIRES"
      - name: Independent safe aggregate only
        if: always()
        timeout-minutes: 3
        run: >-
          python -I -B scripts/isolated_memory/analyze.py
          "$RUNNER_TEMP/hud-finite-attribution-owned" "$REVIEWED_FREEZE" "$REVIEWED_REPORT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: same-trace-pair-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/hud-finite-attribution-owned/aggregate-artifact/analysis.json
          if-no-files-found: error
          retention-days: 14
