name: Desktop Release (skeleton — DR-3A, NON-PUBLISHING)

# DR-3A hardened skeleton. Still NON-PUBLISHING:
# - Trigger: workflow_dispatch ONLY (no PR / push / tag automation).
# - Input: full 40-char commit SHA (source contract) — validated mechanically:
#   checked out SHA == requested SHA == GITHUB_SHA. No silent fallback to main.
# - Environment: desktop-release (protected-branches deployment policy; ZERO
#   secrets). Does NOT run on forks/PRs by construction.
# - Permissions: contents: read ONLY.
# - NO APPLE_* / secrets.* references. No signing, notarization, tag,
#   GitHub Release, asset upload, or contents: write.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit SHA to validate (release source contract)"
        required: true

permissions:
  contents: read

jobs:
  public-internal-split-proof:
    name: Public build + negative-string proof + tests
    runs-on: macos-latest
    environment: desktop-release
    timeout-minutes: 30
    steps:
      - name: Validate input SHA format
        run: |
          SHA="${{ inputs.sha }}"
          case "$SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::input must be full 40-char commit SHA"; exit 1 ;;
          esac

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # Exact-source truth (J): built source SHA == requested SHA == GITHUB_SHA.
      - name: Source-SHA contract
        id: sha
        run: |
          echo "github_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "requested=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "checked_out=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.sha }}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::checked-out SHA != requested SHA"
            exit 1
          fi
          if [ "${{ inputs.sha }}" != "${{ github.sha }}" ]; then
            echo "::error::requested SHA != GITHUB_SHA"
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (all env-gated tests)
        working-directory: experiments/desktop-alpha
        run: cargo test

      - name: Public release build (desktop-test-hooks OFF)
        working-directory: experiments/desktop-alpha
        run: cargo build --release

      - name: Negative-string proof (no test hooks in public binary)
        working-directory: experiments/desktop-alpha
        run: |
          BIN=target/release/hermes-hud-desktop
          for s in HUD_HERMES_BIN HUD_DESKTOP_TEST_HOME HUD_DESKTOP_AUTOSTART \
                   HUD_DESKTOP_TEST_MODE /tmp/hud-state.log /tmp/hud-handshake.log \
                   /tmp/hud-detect.log; do
            c=$(strings "$BIN" | grep -cF "$s" || true)
            echo "$s: $c"
            if [ "$c" != "0" ]; then
              echo "::error::test-hook string '$s' present in public binary ($c)"
              exit 1
            fi
          done
          echo "negative-string proof: PASS"

      - name: Security tests (nav guard / semver / argv / probe-before-spawn)
        working-directory: experiments/desktop-alpha
        run: cargo test --features desktop-test-hooks

      - name: Output exact-source truth
        run: |
          echo "GITHUB_SHA=${{ steps.sha.outputs.github_sha }}"
          echo "REQUESTED_SHA=${{ steps.sha.outputs.requested }}"
          echo "BUILT_SOURCE_SHA=${{ steps.sha.outputs.checked_out }}"
          echo "MATCH=yes"
