[package]
name = "hermes-hud-desktop"
version = "0.1.0"
description = "Hermes HUD Desktop prototype — remote WebView shell over the running Hermes Dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
semver = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
